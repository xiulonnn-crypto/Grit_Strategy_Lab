[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grit-backtest-platform"
dynamic = ["version"]
description = "Grit Strategy Lab backtest platform vertical slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "bottleneck>=1.3",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
openbb-provider = [
  "openbb",
  "openbb-yfinance",
  "openbb-tiingo",
  "openbb-alpha-vantage",
  "openbb-fmp",
  "openbb-fred",
  "openbb-federal-reserve",
]
pit-external = [
  "duckdb>=1.1",
  "pyarrow>=16.0",
  "kaggle>=2.0",
]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "grit_backtest_platform._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
cache_dir = ".tmp/pytest-runtime/cache"
